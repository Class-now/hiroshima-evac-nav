name: river-data
on:
  push:
    branches: [mvp-1101]
    paths: [scripts/build_river.py, .github/workflows/river-data.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -I scripts/build_river.py --raw "$RUNNER_TEMP/river" --probe
